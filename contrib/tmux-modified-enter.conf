# XFCE Terminal preserves modified Enter as CSI-u when tmux is in front.
# Match the active pane at keypress time; no shell processes are spawned here.
# send-keys forwards to the pane, without recursively invoking these bindings.
bind-key -n S-Enter if-shell -F '#{m/r:^(codex|gemini|agy)(-|$),#{pane_current_command}}' 'send-keys C-j' 'send-keys S-Enter'
bind-key -n C-Enter if-shell -F '#{m/r:^(codex|gemini|agy)(-|$),#{pane_current_command}}' 'send-keys C-j' 'send-keys C-Enter'
bind-key -n M-Enter if-shell -F '#{m/r:^(codex|gemini|agy)(-|$),#{pane_current_command}}' 'send-keys C-j' 'send-keys M-Enter'
